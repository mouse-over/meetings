name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux CPU build (no Metal), no models: fmt, clippy and unit tests only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes the libs sherpa-onnx-sys extracts into target/sherpa-onnx-prebuilt but keeps the build
      # script's output; after a partial cache restore sherpa-onnx-sys then recompiles against a missing static lib.
      # Forget the build script run so it extracts (or downloads) the libs again.
      - name: Drop stale sherpa-onnx build outputs
        run: |
          if ! find target/sherpa-onnx-prebuilt -name libsherpa-onnx-c-api.a 2>/dev/null | grep -q .; then
            ls -R target/sherpa-onnx-prebuilt 2>/dev/null | head -20 || true
            rm -rf target/debug/build/sherpa-onnx-sys-* target/debug/.fingerprint/sherpa-onnx-sys-*
          fi
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features
