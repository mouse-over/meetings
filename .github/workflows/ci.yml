name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux CPU build (no Metal), no models: fmt, clippy, unit tests and a debug build of the desktop app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes the libs sherpa-onnx-sys extracts into target/sherpa-onnx-prebuilt (leaving an empty lib/,
      # which its build script accepts) but keeps the build script's output; after a partial cache restore
      # sherpa-onnx-sys then recompiles against a missing static lib. Remove both so the libs are downloaded again.
      - name: Drop stale sherpa-onnx build outputs
        run: |
          if ! find target/sherpa-onnx-prebuilt -name libsherpa-onnx-c-api.a 2>/dev/null | grep -q .; then
            rm -rf target/sherpa-onnx-prebuilt target/debug/build/sherpa-onnx-sys*
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # cmake/libclang: whisper.cpp; webkit2gtk, xdo, rsvg: Tauri (apps/desktop)
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features
      # Front-end build (tsc + vite) and the app with its assets embedded, without bundling.
      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --debug --no-bundle --ci -- --no-default-features
