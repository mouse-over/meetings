name: release-pr

# Releases are started by hand: Actions -> release-pr -> Run workflow.
#   1. `pr` (workflow_dispatch): next version from conventional commits since the last vX.Y.Z tag (git-cliff,
#      cliff.toml) or the chosen bump; bumps [workspace.package] version, regenerates CHANGELOG.md and opens the
#      release PR `chore: release vX.Y.Z`.
#   2. `tag` (push to main): when the workspace version has no tag yet, i.e. the release PR was merged, pushes tag
#      vX.Y.Z, which runs release.yml (build, smoke test, GitHub release).
#
# Needs secret RELEASE_PLZ_TOKEN (fine-grained PAT, Contents + Pull requests read & write on this repo): with the
# default GITHUB_TOKEN the release PR would not run ci.yml and the tag would not trigger release.yml.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: feat -> minor, fix and others -> patch, from commits since the last tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  pr:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Bump version and changelog
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          workspace_version() {
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "mo-meetings-cli") | .version'
          }
          current=$(workspace_version)
          if [[ "$BUMP" == auto ]]; then next=$(git cliff --bumped-version); else next=$(git cliff --bumped-version --bump "$BUMP"); fi
          next=${next#v}
          if [[ "$next" == "$current" ]] || git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then
            echo "::error::nothing to release: no feat/fix/... commits since the last tag (v$current); pick a bump explicitly"
            exit 1
          fi
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$next\"/" Cargo.toml
          [[ "$(workspace_version)" == "$next" ]] || { echo "::error::failed to set version $next in Cargo.toml"; exit 1; }
          cargo update --workspace
          git cliff --tag "v$next" -o CHANGELOG.md
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: release v$VERSION"
          git push --force origin "$branch"
          notes=$(git cliff --unreleased --tag "v$VERSION" --strip all)
          body=$(printf 'Merging this PR tags `v%s`, which builds and publishes the release (`release.yml`).\n\n%s\n' \
            "$VERSION" "$notes")
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "chore: release v$VERSION" --body "$body"
          fi

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Tag a new workspace version
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release"
            exit 0
          fi
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          echo "::notice::pushed tag v$version"
