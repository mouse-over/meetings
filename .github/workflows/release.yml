name: release

# Push a tag `vX.Y.Z` (matching the workspace version in Cargo.toml) to build the CLI, the MCP server and the desktop
# app (apps/desktop: .dmg, .deb + .AppImage, NSIS setup), smoke-test them on fresh runners and publish a GitHub release. Pull requests that touch this file run build + smoke
# test only.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Metal; sherpa-onnx as shared libraries + Microsoft's onnxruntime (see mo-meetings-core/build.rs).
          - target: aarch64-apple-darwin
            os: macos-15
            cargo_flags: ""
            bundles: dmg
          # CPU only; sherpa-onnx linked statically. Oldest supported Ubuntu for a lower glibc requirement.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cargo_flags: --no-default-features
            bundles: deb,appimage
          # CPU only; sherpa-onnx static (/MT) and the C runtime linked statically too (.cargo/config.toml).
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            cargo_flags: --no-default-features
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        if: runner.os == 'Linux'
        # cmake/libclang: whisper.cpp; webkit2gtk, xdo, rsvg: Tauri; patchelf, file: AppImage bundling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf file
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check tag matches the workspace version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mo-meetings-cli") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p mo-meetings-cli -p mo-meetings-mcp ${{ matrix.cargo_flags }}
      - name: Package
        shell: bash
        run: |
          name="mo-meetings-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "$RUNNER_OS" == Windows ]]; then exe=.exe; fi
          cp "target/release/mo-meetings$exe" "target/release/mo-meetings-mcp$exe" README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # The binary's rpath is @executable_path/onnxruntime, then @executable_path. build.rs only warns when
            # it cannot fetch Microsoft's onnxruntime; a release without it would be ~2.3x slower, so fail here.
            test -f target/release/onnxruntime/libonnxruntime.dylib
            cp target/release/libsherpa-onnx-c-api.dylib "dist/$name/"
            cp -R target/release/onnxruntime "dist/$name/"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$name.zip"
            (cd dist && 7z a -tzip "$archive" "$name" > /dev/null && sha256sum "$archive" > "$archive.sha256")
          else
            archive="$name.tar.gz"
            tar -C dist -czf "dist/$archive" "$name"
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
      # Desktop app. On macOS tauri.conf.json copies the sherpa-onnx and Microsoft onnxruntime dylibs from
      # target/release into Contents/Frameworks (the binary's rpath) and signs the bundle ad hoc.
      - name: Build desktop app
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npx tauri build --ci --bundles ${{ matrix.bundles }} -- --locked ${{ matrix.cargo_flags }}
      - name: Package desktop app
        shell: bash
        run: |
          name="mo-meetings-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist-desktop
          shopt -s nullglob
          count=0
          for f in target/release/bundle/{dmg/*.dmg,deb/*.deb,appimage/*.AppImage,nsis/*.exe}; do
            case "$f" in
              *.dmg) out="$name.dmg" ;;
              *.deb) out="$name.deb" ;;
              *.AppImage) out="$name.AppImage" ;;
              *.exe) out="$name-setup.exe" ;;
            esac
            cp "$f" "dist-desktop/$out"
            (cd dist-desktop && { sha256sum "$out" 2>/dev/null || shasum -a 256 "$out"; } > "$out.sha256")
            count=$((count + 1))
          done
          ls -l dist-desktop
          expected=$(tr ',' '\n' <<<"${{ matrix.bundles }}" | wc -l)
          [[ $count -eq $expected ]] \
            || { echo "::error::expected $expected desktop bundles (${{ matrix.bundles }})"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error

  smoke:
    # Fresh runners without the build tree: the archive must work on its own.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
      - name: Verify, unpack and run
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            sha256sum -c ./*.zip.sha256
            7z x ./*.zip > /dev/null
            bin=$(echo mo-meetings-*/mo-meetings.exe)
            mcp=$(echo mo-meetings-*/mo-meetings-mcp.exe)
          else
            shasum -a 256 -c ./*.tar.gz.sha256
            tar -xzf ./*.tar.gz
            bin=$(echo mo-meetings-*/mo-meetings)
            mcp=$(echo mo-meetings-*/mo-meetings-mcp)
          fi
          "$bin" --version
          "$mcp" --version
          MO_MEETINGS_MODELS_DIR="$RUNNER_TEMP/models" "$bin" models list
          # MCP handshake over stdio: initialize, then list the tools.
          tools=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$mcp")
          echo "$tools"
          grep -q '"name":"transcribe"' <<<"$tools" && grep -q '"name":"diarize"' <<<"$tools" \
            || { echo "::error::MCP server did not list its tools"; exit 1; }
          if [[ "$RUNNER_OS" == macOS ]]; then
            mcp_libs=$(DYLD_PRINT_LIBRARIES=1 "$mcp" --version 2>&1)
            grep -q "/mo-meetings-[^/]*/onnxruntime/libonnxruntime.dylib" <<<"$mcp_libs" \
              || { echo "::error::mo-meetings-mcp did not load the archive's onnxruntime"; exit 1; }
            libs=$(DYLD_PRINT_LIBRARIES=1 "$bin" --version 2>&1)
            grep -E 'onnx|sherpa' <<<"$libs"
            grep -q "/mo-meetings-[^/]*/onnxruntime/libonnxruntime.dylib" <<<"$libs" \
              || { echo "::error::Microsoft onnxruntime from the archive was not loaded"; exit 1; }
          elif [[ "$RUNNER_OS" == Windows ]]; then
            # Runners have the VC++ redistributable, so running the binary does not prove it is self-contained.
            deps=$(ldd "$bin" "$mcp")
            echo "$deps"
            if grep -qiE 'vcruntime1|msvcp1|onnx|sherpa|not found' <<<"$deps"; then
              echo "::error::binary depends on DLLs that are not part of Windows"; exit 1
            fi
          else
            deps=$(ldd "$bin" "$mcp")
            echo "$deps"
            if grep -q 'not found' <<<"$deps"; then echo "::error::missing shared libraries"; exit 1; fi
          fi

  smoke-desktop:
    # Fresh macOS runner: the .dmg must run on its own, loading the dylibs from Contents/Frameworks.
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-aarch64-apple-darwin
      - name: Verify, mount and launch
        run: |
          shasum -a 256 -c ./*.dmg.sha256
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" ./*.dmg
          app=$(echo "$RUNNER_TEMP"/dmg/*.app)
          ls -l "$app/Contents/Frameworks"
          test -f "$app/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          test -f "$app/Contents/Frameworks/libonnxruntime.dylib"
          codesign --verify --deep --strict --verbose=2 "$app"
          exe=$(echo "$app"/Contents/MacOS/*)
          DYLD_PRINT_LIBRARIES=1 "$exe" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            cat "$RUNNER_TEMP/app.log"
            echo "::error::desktop app exited during startup"; exit 1
          fi
          kill "$pid"
          grep -E 'onnx|sherpa' "$RUNNER_TEMP/app.log"
          grep -q "\.app/Contents/Frameworks/libonnxruntime.dylib" "$RUNNER_TEMP/app.log" \
            || { echo "::error::the app did not load onnxruntime from Contents/Frameworks"; exit 1; }
          grep -q "\.app/Contents/Frameworks/libsherpa-onnx-c-api.dylib" "$RUNNER_TEMP/app.log" \
            || { echo "::error::the app did not load sherpa-onnx from Contents/Frameworks"; exit 1; }

  release:
    needs: [smoke, smoke-desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
