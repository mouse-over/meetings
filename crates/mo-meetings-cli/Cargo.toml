[package]
name = "mo-meetings-cli"
description = "Command line interface for local meeting transcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "mo-meetings"
path = "src/main.rs"

[features]
default = ["metal"]
# whisper.cpp on the GPU via Metal (macOS only; build with --no-default-features elsewhere)
metal = ["mo-meetings-core/metal"]

[dependencies]
mo-meetings-core.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde_json.workspace = true
serde.workspace = true

[lints]
workspace = true
