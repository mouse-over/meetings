[package]
name = "mo-meetings-core"
description = "Local meeting transcription with speaker diarization (audio, diarization, ASR, assembly, VTT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# whisper.cpp on the GPU via Metal (macOS)
metal = ["whisper-rs/metal"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
rubato.workspace = true
whisper-rs.workspace = true
dirs.workspace = true
sha2.workspace = true
ureq.workspace = true

# macOS: sherpa-onnx as shared libraries so that build.rs can put Microsoft's onnxruntime in front of the one
# bundled in the sherpa-onnx release (same version, but that build is ~2.3x slower on Apple Silicon).
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = { workspace = true, features = ["shared"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-onnx = { workspace = true, features = ["static"] }

[build-dependencies]
sha2.workspace = true
