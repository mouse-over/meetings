[workspace]
resolver = "3"
members = ["crates/mo-meetings-core", "crates/mo-meetings-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/mouse-over/meetings"

[workspace.dependencies]
mo-meetings-core = { path = "crates/mo-meetings-core", default-features = false }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "isomp4", "aac", "wav", "pcm", "mp3", "flac", "mkv", "ogg", "vorbis", "caf", "aiff", "alac"] }
rubato = "5.0.1"
whisper-rs = "0.16.0"
sherpa-onnx = { version = "2.0.1", default-features = false }
dirs = "7.0.0"
sha2 = "0.11.1"
ureq = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"

[profile.release]
lto = "thin"
