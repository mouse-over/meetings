[workspace]
resolver = "3"
members = [
  "crates/mo-meetings-core",
  "crates/mo-meetings-project",
  "crates/mo-meetings-cli",
  "crates/mo-meetings-mcp",
  "apps/desktop/src-tauri",
]
# Plain `cargo build` skips the desktop app (needs Rust 1.90 and, on Linux, webkit2gtk); `--workspace` includes it.
default-members = [
  "crates/mo-meetings-core",
  "crates/mo-meetings-project",
  "crates/mo-meetings-cli",
  "crates/mo-meetings-mcp",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
publish = false
repository = "https://github.com/mouse-over/meetings"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mo-meetings-core = { path = "crates/mo-meetings-core", default-features = false }
mo-meetings-project = { path = "crates/mo-meetings-project" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "isomp4", "aac", "wav", "pcm", "mp3", "flac", "mkv", "ogg", "vorbis", "caf", "aiff", "alac"] }
rubato = "5.0.1"
whisper-rs = "0.16.0"
sherpa-onnx = { version = "2.0.1", default-features = false }
dirs = "7.0.0"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.11.1"
ureq = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
rmcp = { version = "3.10.0", features = ["transport-io"] }
schemars = "1.0"
# SQLite compiled in (no system library), for the project files
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
lto = "thin"

# Shipped code never panics: it returns `Result`/`Option` so a bug fails one run, not the app (which
# stays open between runs) or the MCP server. Tests may unwrap, expect and panic (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
