# git-cliff (https://git-cliff.org): next version and CHANGELOG.md from conventional commits since the last vX.Y.Z
# tag. Used by .github/workflows/release-pr.yml; the whole workspace shares one version and one changelog.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}]({% if previous.version -%}
https://github.com/mouse-over/meetings/compare/{{ previous.version }}...{{ version }}
{%- else -%}
https://github.com/mouse-over/meetings/releases/tag/{{ version }}
{%- endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/mouse-over/meetings/pull/${1}))" },
]
# User-facing changes only; ci, build, chore, test and style commits stay out of the changelog.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = ".*", skip = true },
]
# Keep breaking commits even if a parser above would skip them.
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
# feat -> minor also before 1.0 (Cargo would bump the patch); a breaking change (`!`) bumps the minor before 1.0
# and the major from 1.0 on. Everything else -> patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
