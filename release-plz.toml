# release-plz (https://release-plz.dev): conventional commits on main -> release PR (version bump + CHANGELOG.md);
# merging it pushes tag vX.Y.Z, which runs .github/workflows/release.yml (build, smoke test, GitHub release).
# All crates share the workspace version, so there is one tag and one changelog, owned by the CLI.
[workspace]
# Not published to crates.io: the current version comes from the latest vX.Y.Z tag.
git_only = true
# release.yml creates the GitHub release once the archives are built and tested.
git_release_enable = false
# Tag only when the merged commit is a release PR, not on every push to main.
release_always = false
semver_check = false
# feat -> minor also before 1.0 (Cargo would otherwise bump the patch), as with nx release.
features_always_increment_minor = true

[[package]]
name = "mo-meetings-cli"
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
# Most changes land in the library; list them in the CLI changelog and let them trigger a release.
changelog_include = ["mo-meetings-core", "mo-meetings-mcp"]
version_group = "workspace"

[[package]]
name = "mo-meetings-core"
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false
version_group = "workspace"

[[package]]
name = "mo-meetings-mcp"
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false
version_group = "workspace"
